name: CI

on: [push, pull_request]

jobs:
  build:
    # Prevent duplicate builds on internal PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test compatible SDK and protobuf version combinations
        # protobuf 5.0.0+: SDK >= 3.7
        include:
          # Test with oldest SDK supported.
          - sdk: "3.7"
            protobuf: "5.0.0"
          - sdk: "3.7"
            protobuf: "6.0.0"
          # Test latest protobuf versions with SDK stable and beta
          - sdk: stable
            protobuf: "5.0.0"
          - sdk: stable
            protobuf: "6.0.0"
          - sdk: beta
            protobuf: "5.0.0"
          - sdk: beta
            protobuf: "6.0.0"
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Override protobuf version
        run: dart pub add protobuf:${{ matrix.protobuf }}

      - name: Start Centrifugo
        run: docker compose up -d --wait

      - name: Run analyzer
        run: dart analyze lib test

      - name: Run tests
        run: dart run test --reporter expanded

  checks:
    # Prevent duplicate builds on internal PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned, since dart format output changes between SDK versions.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.6"

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        # Generated protobuf code is left as protoc_plugin writes it.
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart' | grep -v '^lib/src/proto/')

      - name: Run browser tests (dart2js)
        run: dart test -p chrome test/web_endpoint_test.dart

      - name: Run browser tests (dart2wasm)
        run: dart test -p chrome --compiler dart2wasm test/web_endpoint_test.dart
